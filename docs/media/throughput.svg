<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Jobs completed per minute</title>
  <desc id="desc">One worker completed 93.7 jobs per minute, two completed 192, four completed 320.8, and eight completed 351.4.</desc>
  <rect width="720" height="380" rx="16" fill="#1b1e16"/>
  <text x="28" y="40" fill="#f4efe4" font-family="Georgia, serif" font-size="22">Jobs completed per minute</text>
  <text x="28" y="64" fill="#b7b09f" font-family="Avenir Next, sans-serif" font-size="13">Same 280,000-row CSV on one Apple M5</text>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#827c70">
    <text x="48" y="104" text-anchor="end">400</text>
    <text x="48" y="164" text-anchor="end">300</text>
    <text x="48" y="224" text-anchor="end">200</text>
    <text x="48" y="284" text-anchor="end">100</text>
    <text x="48" y="314" text-anchor="end">0</text>
  </g>
  <g stroke="rgba(244,239,228,0.12)">
    <line x1="60" y1="100" x2="680" y2="100"/>
    <line x1="60" y1="160" x2="680" y2="160"/>
    <line x1="60" y1="220" x2="680" y2="220"/>
    <line x1="60" y1="280" x2="680" y2="280"/>
    <line x1="60" y1="310" x2="680" y2="310"/>
  </g>
  <g fill="#e38b45">
    <rect x="110" y="261" width="72" height="49" rx="6"/>
    <rect x="250" y="209" width="72" height="101" rx="6"/>
    <rect x="390" y="142" width="72" height="168" rx="6"/>
    <rect x="530" y="126" width="72" height="184" rx="6"/>
  </g>
  <g fill="#f4efe4" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" text-anchor="middle">
    <text x="146" y="252">93.7</text>
    <text x="286" y="200">192</text>
    <text x="426" y="133">320.8</text>
    <text x="566" y="117">351.4</text>
  </g>
  <g fill="#b7b09f" font-family="Avenir Next, sans-serif" font-size="14" text-anchor="middle">
    <text x="146" y="338">1 worker</text>
    <text x="286" y="338">2 workers</text>
    <text x="426" y="338">4 workers</text>
    <text x="566" y="338">8 workers</text>
  </g>
</svg>
