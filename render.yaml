# Applying this file creates paid Render resources. Do not sync it until that bill is accepted.
# At the published rates this is about $30 per month:
#   web service on the free plan: $0
#   private API, 0.5 CPU / 512 MB: $7
#   background worker, 0.5 CPU / 512 MB: $7
#   Postgres, 0.1 CPU / 256 MB, 1 GB disk: $6 plus any extra storage
#   Key Value, 256 MB with disk persistence: $10
# Private services and background workers have no free plan. A free web service can
# call the private API, and it sleeps when idle. Free Postgres expires after 30 days
# and free Key Value drops its data on restart, so those are not used here.
# Object storage and the OpenID provider are outside Render. Cloudflare R2 has a free
# tier. Fill the queuelab-production secrets in the dashboard. Do not commit them.
# After the first deploy, set OIDC_REDIRECT_URI to the web origin plus /api/v1/auth/callback.

services:
  - type: web
    name: queuelab-web
    runtime: docker
    plan: free
    dockerfilePath: ./infrastructure/Dockerfiles/web.Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_HOSTPORT
        fromService:
          name: queuelab-api
          type: pserv
          property: hostport

  - type: pserv
    name: queuelab-api
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./infrastructure/Dockerfiles/api.Dockerfile
    dockerContext: .
    preDeployCommand: pnpm --filter @queuelab/database exec prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: queuelab-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: queuelab-redis
          type: keyvalue
          property: connectionString
      - key: WEB_ORIGIN
        fromService:
          name: queuelab-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_COOKIE_SECRET
        generateValue: true
      - key: DEMO_USER_EMAIL
        value: demo@queuelab.dev
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - fromGroup: queuelab-production

  - type: worker
    name: queuelab-worker
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./infrastructure/Dockerfiles/worker.Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: queuelab-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: queuelab-redis
          type: keyvalue
          property: connectionString
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - fromGroup: queuelab-production

  - type: keyvalue
    name: queuelab-redis
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: queuelab-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: queuelab
    ipAllowList: []

envVarGroups:
  - name: queuelab-production
    envVars:
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
